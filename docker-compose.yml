services:
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: college-backend:hardened
    container_name: college-backend-1
    restart: always
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-1
      - MONGO_URI=mongodb+srv://complaintAdmin2:Complaint12345@collegecomplaints.dftsvpa.mongodb.net/?appName=CollegeComplaints
      - JWT_SECRET=college_complaint_portal_secret_2026
    expose:
      - "5000"
    networks:
      - app-network

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: college-backend:hardened
    container_name: college-backend-2
    restart: always
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-2
      - MONGO_URI=mongodb+srv://complaintAdmin2:Complaint12345@collegecomplaints.dftsvpa.mongodb.net/?appName=CollegeComplaints
      - JWT_SECRET=college_complaint_portal_secret_2026
    expose:
      - "5000"
    networks:
      - app-network

  backend3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: college-backend:hardened
    container_name: college-backend-3
    restart: always
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-3
      - MONGO_URI=mongodb+srv://complaintAdmin2:Complaint12345@collegecomplaints.dftsvpa.mongodb.net/?appName=CollegeComplaints
      - JWT_SECRET=college_complaint_portal_secret_2026
    expose:
      - "5000"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: college-nginx-lb
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
