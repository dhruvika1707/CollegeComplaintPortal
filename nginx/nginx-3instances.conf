events {
    worker_connections 1024;
}

http {
    log_format loadbalanced '$remote_addr - $remote_user [$time_local] "$request" '
                            'status=$status upstream_addr=$upstream_addr upstream_status=$upstream_status '
                            'response_time=${upstream_response_time}s';

    access_log /var/log/nginx/access.log loadbalanced;
    error_log /var/log/nginx/error.log warn;

    upstream backend_cluster {
        # Round-robin load balancing across 3 backend containers
        server backend1:5000 max_fails=3 fail_timeout=10s;
        server backend2:5000 max_fails=3 fail_timeout=10s;
        server backend3:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Resilient High-Availability Failover (Question 1c Config)
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
        }
    }
}
