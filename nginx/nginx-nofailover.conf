events {
    worker_connections 1024;
}

http {
    log_format loadbalanced '$remote_addr - $remote_user [$time_local] "$request" '
                            'status=$status upstream_addr=$upstream_addr upstream_status=$upstream_status '
                            'response_time=${upstream_response_time}s';

    access_log /var/log/nginx/access.log loadbalanced;
    error_log /var/log/nginx/error.log warn;

    upstream backend_cluster {
        server backend1:5000;
        server backend2:5000;
        server backend3:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Failover disabled: requests to downed server fail immediately with 502
            proxy_next_upstream off;
        }
    }
}
